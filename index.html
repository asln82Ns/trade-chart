<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Chart</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Trade Chart</h1>
            <div class="status" id="status">Ready</div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="csvFile">Load CSV:</label>
                <input type="file" id="csvFile" accept=".csv">
                <button id="processBtn" disabled>Process Data</button>
                <div id="processProgress" class="progress-bar" style="display: none;">
                    <div id="progressFill" class="progress-fill"></div>
                    <span id="progressText">0%</span>
                </div>
            </div>

            <div class="control-group">
                <label for="jumpTime">Jump to Time (UTC):</label>
                <input type="datetime-local" id="jumpTime" step="1" placeholder="Enter UTC time">
                <button id="jumpBtn" disabled>Load</button>
                <span style="font-size: 12px; color: #888;">Enter time in UTC timezone</span>
            </div>

            <div class="control-group">
                <button id="playBtn" disabled>Play</button>
                <button id="pauseBtn" disabled>Pause</button>
                <button id="resetBtn" disabled>Reset</button>
            </div>

            <div class="control-group">
                <label for="speedControl">Speed (ticks/sec): <span id="speedValue">25</span></label>
                <input type="range" id="speedControl" min="5" max="50" value="25" step="5" disabled>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">Current Time:</span>
                    <span id="currentTime">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Price:</span>
                    <span id="currentPrice">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Bar Progress:</span>
                    <span id="barProgress">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Loaded Bars:</span>
                    <span id="loadedBars">0</span>
                </div>
            </div>
        </div>

        <div id="chartContainer" class="chart-container"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
