<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Chart</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Trade Chart</h1>
            <div class="status" id="status">Ready</div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="csvFile">Load CSV:</label>
                <input type="file" id="csvFile" accept=".csv">
                <button id="processBtn" disabled>Process Data</button>
                <div id="processProgress" class="progress-bar" style="display: none;">
                    <div id="progressFill" class="progress-fill"></div>
                    <span id="progressText">0%</span>
                </div>
            </div>

            <div class="control-group">
                <label for="jumpTime">Jump to Time (UTC):</label>
                <input type="datetime-local" id="jumpTime" step="1" placeholder="Enter UTC time">
                <button id="jumpBtn" disabled>Load</button>
                <span style="font-size: 12px; color: #888;">Enter time in UTC timezone</span>
            </div>

            <div class="control-group">
                <button id="playBtn" disabled>Play</button>
                <button id="pauseBtn" disabled>Pause</button>
                <button id="resetBtn" disabled>Reset</button>
            </div>

            <div class="control-group">
                <label for="speedControl">Speed (ticks/sec): <span id="speedValue">100</span></label>
                <input type="range" id="speedControl" min="10" max="5000" value="100" step="10" disabled>
                <button class="speed-preset-btn" data-speed="10" disabled>10</button>
                <button class="speed-preset-btn" data-speed="100" disabled>100</button>
                <button class="speed-preset-btn" data-speed="300" disabled>300</button>
                <button class="speed-preset-btn" data-speed="5000" disabled>5000</button>
            </div>

            <!-- Trade Controls -->
            <div class="control-group trade-controls">
                <label for="quantityInput">Quantity:</label>
                <input type="number" id="quantityInput" min="1" value="1" step="1">
                <button id="buyBtn" class="buy-btn" disabled>BUY</button>
                <button id="sellBtn" class="sell-btn" disabled>SELL</button>
                <button id="tradeLogBtn" class="trade-log-btn">Trade Log</button>
            </div>

            <!-- Trade Info Panel -->
            <div class="info-panel trade-info-panel">
                <div class="info-item">
                    <span class="info-label">Position:</span>
                    <span id="positionDisplay" class="position-text">FLAT</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Avg Entry:</span>
                    <span id="avgEntryDisplay">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Realized P&L:</span>
                    <span id="realizedPnL">+$0.00</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Unrealized P&L:</span>
                    <span id="unrealizedPnL">+$0.00</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Total P&L:</span>
                    <span id="totalPnL" class="total-pnl">+$0.00</span>
                </div>
            </div>

            <!-- Existing Info Panel -->
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">Current Time:</span>
                    <span id="currentTime">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Open:</span>
                    <span id="currentOpen">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">High:</span>
                    <span id="currentHigh">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Low:</span>
                    <span id="currentLow">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Close:</span>
                    <span id="currentClose">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Bar Progress:</span>
                    <span id="barProgress">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Loaded Bars:</span>
                    <span id="loadedBars">0</span>
                </div>
            </div>
        </div>

        <div id="chartContainer" class="chart-container"></div>
    </div>

    <!-- Trade Log Modal -->
    <div id="tradeLogModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Trade Log</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="tradeLogContent"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
